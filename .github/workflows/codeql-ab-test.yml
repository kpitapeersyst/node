name: "CodeQL A/B test"

on:
    pull_request:
        types: [opened, synchronize]

permissions: {}

jobs:
    analyze:
        name: Analyze (go, ${{ matrix.variant }})
        runs-on: ubuntu-latest
        permissions:
            contents: read
            security-events: write
        strategy:
            fail-fast: false
            matrix:
                variant: [runs-make, skip-make]
        env:
            # Empty keeps the default behavior, where the Go autobuilder runs `make` before extracting
            CODEQL_EXTRACTOR_GO_BUILD_COMMAND: ${{ matrix.variant == 'skip-make' && 'go mod download' || '' }}
        steps:
            -   uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
            -   uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
                with:
                    languages: go
                    build-mode: autobuild
            -   uses: github/codeql-action/autobuild@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
            -   uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
                with:
                    category: /language:go/${{ matrix.variant }}
                    upload: never
                    output: sarif-results
            -   name: Summarize findings
                run: |
                    echo "findings: $(jq '[.runs[].results[]] | length' sarif-results/go.sarif)"
                    jq -r '[.runs[].results[] | .ruleId + " " + .locations[0].physicalLocation.artifactLocation.uri] | sort | .[]' sarif-results/go.sarif
