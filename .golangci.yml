version: "2"
run:
  concurrency: 4
  tests: true
linters:
  # Only the linters listed below run, nothing is enabled implicitly
  default: none
  enable:
    - asciicheck
    - copyloopvar
    - dogsled
    - dupl
    - errcheck
    - goconst
    - gocritic
    - gomodguard
    - gosec
    - govet
    - ineffassign
    - misspell
    - nakedret
    - nolintlint
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    dogsled:
      max-blank-identifiers: 3
    gomodguard:
      blocked:
        versions:
          - https://github.com/etcd-io/etcd:
              version: '>= 3.4.10 || ~3.3.23'
              reason: CVE-2020-15114; CVE-2020-15136; CVE-2020-15115
          - https://github.com/dgrijalva/jwt-go:
              version: '>= 4.0.0-preview1'
              reason: CVE-2020-26160
    misspell:
      locale: US
    nolintlint:
      require-explanation: false
      require-specific: false
      allow-unused: false
    staticcheck:
      checks:
        - all
        - -SA1019
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Renaming the existing utils/types packages is not worth the churn
      - linters:
          - revive
        text: "var-naming: avoid meaningless package names"
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofumpt
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
